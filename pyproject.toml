[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "domesti-bot"
version = "2.0.0"
description = "Self-hosted LAN home automation: tile UI and rule engine for TP-Link Kasa, Sonos, Vizio SmartCast, and GoTailwind devices, with My Tracks presence and geofence-driven automations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Henrique Andrade", email = "thehcma@users.noreply.github.com" },
]
requires-python = ">=3.12"
keywords = [
    "domesti-bot",
    "fastapi",
    "home-automation",
    "kasa",
    "my-tracks",
    "owntracks",
    "rule-engine",
    "sonos",
    "tailwind",
    "vizio",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
dependencies = [
    "aioesphomeapi>=45.6.2",
    "aiohappyeyeballs>=2.7.1",
    "aiohttp>=3.14.3",
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio>=4.14.2",
    "astral>=3.2",
    "asttokens==3.0.2",
    "asyncclick==8.4.2.1",
    "certifi>=2026.7.22",
    "cffi>=2.1.1",
    "charset-normalizer>=3.5.1",
    "click>=8.5.0",
    "croniter>=6.2.4",
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "gotailwind[cli]",
    "greenlet>=3.5.5",
    "httptools==0.8.0",
    "httpx>=0.28.1",
    "idna>=3.19",
    "lxml>=6.1.2",
    "mashumaro==3.22",
    "playwright>=1.62.0",
    "prompt_toolkit>=3.0.43",
    "protobuf>=7.36.0",
    "pychromecast>=14.0.10",
    "pyproj",
    "pyright>=1.1.411",
    # TEMPORARY: pin python-kasa to PR #1692 (IOT KLAP v2 transport selection).
    # Revert to a PyPI ``python-kasa`` release once
    # https://github.com/python-kasa/python-kasa/pull/1692 merges and ships.
    "python-kasa @ git+https://github.com/python-kasa/python-kasa.git@refs/pull/1692/head",
    "requests>=2.34.2",
    "soco>=0.31.2",
    "sqlalchemy>=2.0.52",
    "starlette>=1.6.0",
    "typer>=0.27.1",
    "typing-extensions==4.16.0",
    "tzdata==2026.3",
    "uvicorn[standard]>=0.52.4",
    "watchfiles==1.2.0",
    "wcwidth>=0.8.2",
    "websockets>=17.1",
    "yarl>=1.24.5",
    "zeroconf>=0.150.0",
]

[project.scripts]
domesti-bot = "app.domesti_bot_cli:main"
domesti-bot-server = "config.serve:main"

[project.urls]
Homepage = "https://github.com/the-hcma/domesti-bot"
Repository = "https://github.com/the-hcma/domesti-bot"
Issues = "https://github.com/the-hcma/domesti-bot/issues"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app", "config"]
# ``dist/`` is gitignored; CI and release builds run ``pnpm run build`` first.
artifacts = [
    "app/api/static/dist/main.js",
    "app/api/static/dist/main.js.map",
]

[tool.hatch.build.targets.sdist]
packages = ["app", "config"]
artifacts = [
    "app/api/static/dist/main.js",
    "app/api/static/dist/main.js.map",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
# Per-test hang guard (issue #675). ``thread`` works under pytest-xdist; ``signal``
# does not interrupt stuck worker threads reliably. Override locally with
# ``--timeout=0`` when debugging under pdb. Note: ``thread`` only raises at a
# Python bytecode boundary — an idle ``await Event().wait()`` parked in
# ``selectors.select(None)`` may not observe it; cancel-path forever-blocks should
# use short ``asyncio.sleep`` loops (or ``wait_for``) so the loop keeps waking.
# CI job ``timeout-minutes`` remains the hard backstop for native/C stalls.
timeout = 60
timeout_method = "thread"
faulthandler_timeout = 70
markers = [
    "browser: layout checks that need headless Chromium (install dev group + playwright)",
    "integration: exercises real LAN hardware; requires env-specific credentials",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app", "config"]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "icecream>=2.2.0",
    "playwright>=1.62.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.5",
]
