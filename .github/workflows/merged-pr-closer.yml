name: Merged PR Closer

# Closes open PRs whose changes already landed on the default branch: either GitHub reports
# the PR as merged (its head branch is then deleted too), or the PR targets the default branch
# and its head commit is strictly behind it (the compare API reports "behind"). In that second
# case the branch is left for the daily stale-branch sweep, because a push can land between the
# check and a delete. PRs that target another branch (stack children), empty branches and PRs
# with commits that are not on the default branch are never closed here.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  close-merged-prs:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Close open PRs that have already been merged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          open_prs=$(gh api "repos/${REPO}/pulls?state=open&per_page=100" \
            --jq '.[].number')

          if [ -z "${open_prs}" ]; then
            echo "No open PRs found — nothing to do."
            echo "## Merged PR Closer" >> "$GITHUB_STEP_SUMMARY"
            echo "No open PRs found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          closed_count=0
          summary_rows=""

          delete_head_branch() {
            local head_ref="$1"
            local encoded="${head_ref//\//%2F}"
            gh api --method DELETE "repos/${REPO}/git/refs/heads/${encoded}" >/dev/null 2>&1 || true
          }

          for pr in ${open_prs}; do
            pr_data=$(gh api "repos/${REPO}/pulls/${pr}" \
              --jq '{
                title: .title,
                merged: .merged,
                merged_at: .merged_at,
                draft: .draft,
                head_ref: .head.ref,
                head_sha: .head.sha,
                head_repo: (.head.repo.full_name // ""),
                base_ref: .base.ref
              }')
            title=$(echo "${pr_data}" | jq -r '.title')
            is_merged=$(echo "${pr_data}" | jq -r '.merged')
            merge_time=$(echo "${pr_data}" | jq -r '.merged_at // empty')
            close_reason=""
            delete_branch=false

            if [ "${is_merged}" = "true" ]; then
              close_reason="merged at ${merge_time:-unknown time}"
              delete_branch=true
            else
              head_sha=$(echo "${pr_data}" | jq -r '.head_sha')
              base_ref=$(echo "${pr_data}" | jq -r '.base_ref')
              compare_status=""
              if [ "${base_ref}" = "${DEFAULT_BRANCH}" ]; then
                if ! compare_status=$(gh api "repos/${REPO}/compare/${base_ref}...${head_sha}" \
                  --jq '.status'); then
                  echo "PR #${pr}: could not compare ${head_sha} with ${base_ref} — skipping."
                  continue
                fi
              fi
              if [ "${compare_status}" = "behind" ]; then
                close_reason="head commit already on ${base_ref}"
              else
                echo "PR #${pr}: open and not yet merged — skipping."
                continue
              fi
            fi

            # Never act on a fork PR's branch name (it could match an unrelated branch here), and
            # skip when the head moved while we were comparing.
            head_repo=$(echo "${pr_data}" | jq -r '.head_repo')
            if [ "${head_repo}" != "${REPO}" ]; then
              echo "PR #${pr}: head is not in ${REPO} — skipping."
              continue
            fi
            current_sha=$(gh api "repos/${REPO}/pulls/${pr}" --jq '.head.sha')
            if [ "${current_sha}" != "$(echo "${pr_data}" | jq -r '.head_sha')" ]; then
              echo "PR #${pr}: head changed while checking — skipping."
              continue
            fi

            echo "Closing PR #${pr}: \"${title}\" (${close_reason})"
            gh api "repos/${REPO}/issues/${pr}/comments" \
              --method POST \
              --field body="This PR's changes have already landed on \`main\` (${close_reason}). Closing automatically." \
              --silent
            gh api "repos/${REPO}/pulls/${pr}" \
              --method PATCH \
              --field state=closed \
              --silent
            if [ "${delete_branch}" = "true" ]; then
              delete_head_branch "$(echo "${pr_data}" | jq -r '.head_ref')"
            fi

            closed_count=$((closed_count + 1))
            summary_rows="${summary_rows}| #${pr} | ${title} | ${close_reason} |\n"
          done

          echo ""
          echo "Done. Closed ${closed_count} PR(s)."

          {
            echo "## Merged PR Closer"
            if [ "${closed_count}" -eq 0 ]; then
              echo "No PRs needed closing."
            else
              echo "Closed **${closed_count}** PR(s) that were already merged:"
              echo ""
              echo "| PR | Title | Reason |"
              echo "|----|-------|--------|"
              printf '%b' "${summary_rows}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
