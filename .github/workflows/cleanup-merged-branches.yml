name: Cleanup Merged Branches

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-merged-branches:
    runs-on: ubuntu-latest

    steps:
      - name: Delete merged and stale closed PR branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          is_graphite_mq_branch() {
            case "${1}" in
              gtmq_batch_*|gtmq_merge_*|gtmq_base_no_ci_batch_*) return 0 ;;
              *) return 1 ;;
            esac
          }

          is_graphite_base_branch() {
            case "${1}" in
              graphite-base/*) return 0 ;;
              *) return 1 ;;
            esac
          }

          is_repo_practices_branch() {
            case "${1}" in
              repo-practices/*) return 0 ;;
              *) return 1 ;;
            esac
          }

          # Read-only GitHub calls: explicit timeout, at most three attempts, linear backoff
          # (CLEANUP_RETRY_DELAY_S seconds times the attempt number). A persistent failure is returned to
          # the caller, which must not mistake it for an empty result and decide a branch's fate from it.
          retry_delay_s="${CLEANUP_RETRY_DELAY_S:-5}"
          gh_read_with_retry() {
            local attempt
            for attempt in 1 2 3; do
              if timeout 60 gh "$@"; then
                return 0
              fi
              if [[ "${attempt}" -lt 3 ]]; then
                sleep $(( attempt * retry_delay_s ))
              fi
            done
            return 1
          }

          delete_branch_ref() {
            local branch="$1"
            local encoded="${branch//\//%2F}"
            # A write: bounded by a timeout but never retried here; the next daily run is the retry.
            if timeout 60 gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/${encoded}" >/dev/null; then
              echo "Deleted ${branch}"
            else
              echo "Failed to delete ${branch}" >&2
              return 1
            fi
          }

          if ! all_branches="$(gh_read_with_retry api "repos/${REPOSITORY}/branches" --paginate --jq '.[].name')"; then
            echo "Failed to list branches of ${REPOSITORY}; nothing was deleted." >&2
            exit 1
          fi
          branches="$(grep -v '^main$' <<<"${all_branches}" || true)"
          if [[ -z "${branches}" ]]; then
            echo "No branches found besides main."
            exit 0
          fi

          stale_cutoff="$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          repo_practices_cutoff="$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          deleted=0
          kept=0
          delete_failures=0

          for branch in ${branches}; do
            # Match on the PR's head ref instead of the REST ``head=owner:branch`` filter: GitHub
            # ignores that filter when the branch name contains a slash and returns every PR, which
            # made unrelated open or merged PRs decide the fate of ``repo-practices/*`` style branches.
            # A PR counts only when its head repository is this repository (owner and name): a same-named
            # branch in a fork must not decide this repository's branch. A failed lookup is not "no PR":
            # keep the branch rather than decide from missing data.
            if ! open_pr_number="$(
              gh_read_with_retry pr list --repo "${REPOSITORY}" --head "${branch}" --state open --limit 100 \
                --json number,headRepository,headRepositoryOwner \
                --jq '[.[] | select(.headRepositoryOwner.login == env.REPOSITORY_OWNER and .headRepository.name == (env.REPOSITORY | split("/")[1]))][0].number // empty'
            )"; then
              echo "Could not look up open PRs for ${branch}; keeping it." >&2
              kept=$(( kept + 1 ))
              continue
            fi
            if [[ -n "${open_pr_number}" ]]; then
              kept=$(( kept + 1 ))
              continue
            fi

            if ! pr_data="$(
              gh_read_with_retry pr list --repo "${REPOSITORY}" --head "${branch}" --state all --limit 100 \
                --json number,state,mergedAt,closedAt,headRepository,headRepositoryOwner \
                --jq '[.[] | select(.headRepositoryOwner.login == env.REPOSITORY_OWNER and .headRepository.name == (env.REPOSITORY | split("/")[1]) and .state != "OPEN")][0] // empty'
            )"; then
              echo "Could not look up closed PRs for ${branch}; keeping it." >&2
              kept=$(( kept + 1 ))
              continue
            fi

            delete_branch=0
            if [[ -n "${pr_data}" ]]; then
              pr_merged="$(jq -r '.mergedAt != null' <<<"${pr_data}")"
              pr_closed_at="$(jq -r '.closedAt' <<<"${pr_data}")"

              if [[ "${pr_merged}" == "true" ]]; then
                delete_branch=1
              elif is_graphite_mq_branch "${branch}"; then
                # Graphite MQ staging branches are ephemeral once their PR closes.
                delete_branch=1
              elif is_repo_practices_branch "${branch}" \
                && [[ "${pr_closed_at}" < "${repo_practices_cutoff}" ]]; then
                # github-repo-lint candidate branches superseded by newer apply-fix PRs.
                delete_branch=1
              elif [[ "${pr_closed_at}" < "${stale_cutoff}" ]]; then
                delete_branch=1
              fi
            elif is_graphite_base_branch "${branch}" || is_graphite_mq_branch "${branch}"; then
              # Graphite restack / MQ branches with no open PR are safe to remove.
              delete_branch=1
            fi

            if [[ "${delete_branch}" -eq 1 ]]; then
              if delete_branch_ref "${branch}"; then
                deleted=$(( deleted + 1 ))
              else
                kept=$(( kept + 1 ))
                delete_failures=$(( delete_failures + 1 ))
              fi
            else
              kept=$(( kept + 1 ))
            fi
          done

          echo "Deleted ${deleted} branches; kept ${kept} branches."

          # Do not report success after an incomplete cleanup; the next daily run retries.
          if [[ "${delete_failures}" -gt 0 ]]; then
            echo "Failed to delete ${delete_failures} branch(es)." >&2
            exit 1
          fi
